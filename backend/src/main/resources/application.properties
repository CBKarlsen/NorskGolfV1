
spring.config.import=optional:classpath:secrets.properties

# The public origin. Feeds the CORS allowlist and the post-logout redirect, so it must be a real
# scheme://host — "/" silently rejected every browser POST (they send Origin, same-origin GETs
# don't) because behind Firebase the app sees the run.app host and treats the SPA as cross-origin.
# Comma-separated: first is canonical (post-logout redirect), all are CORS-allowed so the
# old host keeps working during a domain switchover.
# secrets.properties overrides this with http://localhost:3000 for local dev.
app.frontend.url=https://golfjakten.no,https://norskgolf.web.app

spring.jpa.hibernate.ddl-auto=update

# No lazy loading during response rendering: a relation that isn't fetched inside the service
# fails loudly here instead of quietly issuing queries after the transaction ended.
spring.jpa.open-in-view=false

spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000

# Cloud Run injects PORT; 8080 everywhere else.
server.port=${PORT:8080}

# Sessions live in the database so a cold start or a second instance doesn't log users out.
spring.session.jdbc.initialize-schema=always

server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Firebase Hosting strips every cookie except one literally named __session
# before forwarding a request to Cloud Run, so the session must use that name
# or every request arrives anonymous.
server.servlet.session.cookie.name=__session

# Behind Firebase, Tomcat sees the run.app host and would rewrite relative
# redirects into absolute run.app URLs, throwing users off the public domain
# mid-login. Keep them relative.
server.tomcat.use-relative-redirects=true

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}