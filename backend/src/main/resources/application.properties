
spring.config.import=optional:classpath:secrets.properties

app.frontend.url=/

spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000

# Cloud Run injects PORT; 8080 everywhere else.
server.port=${PORT:8080}

# Sessions live in the database so a cold start or a second instance doesn't log users out.
spring.session.jdbc.initialize-schema=always

server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Firebase Hosting strips every cookie except one literally named __session
# before forwarding a request to Cloud Run, so the session must use that name
# or every request arrives anonymous.
server.servlet.session.cookie.name=__session

# Behind Firebase, Tomcat sees the run.app host and would rewrite relative
# redirects into absolute run.app URLs, throwing users off the public domain
# mid-login. Keep them relative.
server.tomcat.use-relative-redirects=true

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}