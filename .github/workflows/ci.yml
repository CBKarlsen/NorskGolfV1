name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # application.properties resolves these at startup, so the context test
      # needs them set — but never the real ones. No datasource is configured
      # either, so Spring Boot falls back to an embedded H2.
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build

  deploy-backend:
    # Only after a merge to master, and only if both test jobs passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Waits for a human to approve in the Actions run before it can deploy.
    # Reviewer and branch policy are configured on the environment itself.
    environment:
      name: production
      url: https://norskgolf-778238820195.europe-north1.run.app
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for Workload Identity
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          # No stored key: GitHub mints a short-lived token, and the provider
          # only trusts tokens claiming this repository.
          workload_identity_provider: projects/778238820195/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@norskgolf.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # Env vars (datasource, OAuth) live on the Cloud Run service and are
      # preserved across deploys — deliberately not duplicated into GitHub.
      - run: gcloud run deploy norskgolf --source . --region=europe-north1 --quiet

  deploy-frontend:
    # The React build lives on Firebase Hosting, not in the JAR, so it needs its
    # own deploy — otherwise a frontend-only change merges and never goes live.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://norskgolf.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/778238820195/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@norskgolf.iam.gserviceaccount.com
      # firebase-tools picks up the credentials the auth step exports.
      - run: npx -y firebase-tools@latest deploy --only hosting --project norskgolf --non-interactive
